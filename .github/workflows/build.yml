name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Windows test package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/ETHERBEAT.exe package/ETHERBEAT.exe
          Copy-Item packaging/START_HERE.txt package/START_HERE.txt

      - name: Upload Windows test ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ETHERBEAT-Windows-x64-V0.1C
          path: package/
          if-no-files-found: error
