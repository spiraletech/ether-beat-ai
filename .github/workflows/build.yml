name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 2

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      - name: Stage Windows test package
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item build/Release/ETHERBEAT.exe package/ETHERBEAT.exe
          @"
          ETHERBEAT // ALIEN WORKSHOP V0.1A

          TEST THIS FIRST:
          1. Run ETHERBEAT.exe.
          2. Click REFERENCE.
          3. Choose a WAV or MP3.
          4. EtherBeat decodes it with Windows Media Foundation and runs the native 1024-point FFT analyzer.
          5. The right panel displays the real 32-band spectrum plus bass, mid, air, and beat metrics.

          GENERATE / MUTATE currently use the explicit mock-wave backend and create valid 48 kHz stereo WAV artifacts. They do NOT yet claim to be the final generative AI model.

          Private corpus, model weights, vocals, LoRAs, and training data are intentionally not shipped in this public test package.
          "@ | Set-Content -Encoding UTF8 package/START_HERE.txt

      - name: Upload Windows test ZIP
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ETHERBEAT-Windows-x64-V0.1A
          path: package/
          if-no-files-found: error
